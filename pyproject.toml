[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "annomate"
version = "1.0.0"
description = "NOAA NMFS Bioacoustic Annotation Discovery, Cloud Audio Linkage, Review & Standardization Platform"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.10"
authors = [
  { name = "NOAA Fisheries Passive Acoustic Monitoring Team" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "altair>=5.3.0",
  "fastapi>=0.110.0",
  "google-cloud-storage>=2.16.0",
  "google-genai>=0.3.0",
  "marimo>=0.9.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "pandas>=2.0.0",
  "plotly>=5.20.0",
  "psycopg[binary]>=3.1.18",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "scipy>=1.11.0",
  "soundfile>=0.12.1",
  "uvicorn[standard]>=0.29.0",
  "xlrd>=2.0.1",
]

[dependency-groups]
test = [
  "httpx>=0.27",
  "pytest>=9.0",
]
lint = [
  "mypy>=1.11",
  "ruff>=0.16",
  "sp-repo-review[cli]>=2026.8",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
pythonpath = ["."]
strict = true
log_level = "INFO"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::ResourceWarning",
  "ignore::UserWarning:marimo.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.mypy]
python_version = "3.10"
files = ["app", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
warn_return_any = false

[[tool.mypy.overrides]]
module = [
  "altair.*",
  "dotenv.*",
  "google.*",
  "markdown.*",
  "marimo.*",
  "notebooks.*",
  "openpyxl.*",
  "pandas.*",
  "plotly.*",
  "psycopg.*",
  "scipy.*",
  "soundfile.*",
  "xlrd.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "W",      # pycodestyle warnings
  "B",      # flake8-bugbear
  "I",      # isort
  "UP",     # pyupgrade
  "C4",     # flake8-comprehensions
  "SIM",    # flake8-simplify
  "RUF",    # Ruff-specific rules
]
ignore = [
  "E501",   # line-too-long (handled by formatter / SQL & HTML templates)
  "RUF001", # intentional scientific Unicode symbols (·, ×, ±, °, —)
  "RUF002", # intentional scientific Unicode in docstrings
  "RUF003", # intentional scientific Unicode in comments
  "RUF012", # class-level mutable dict defaults in read-only schema maps
]

[tool.ruff.lint.per-file-ignores]
"notebooks/review_studio.py" = [
  "B018",   # Marimo reactive cells intentionally place final UI expression at end of cell
  "I001",   # Marimo manages cell-local import ordering
]

[tool.codespell]
skip = "*.png,*.jpg,*.npz,*.wav,*.aif,.venv,data"

[tool.marimo.display]
theme = "dark"
cell_output = "below"
default_width = "full"
